name: CrucibleIOS
options:
  bundleIdPrefix: com.guitaripod
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: "$(inherited) -package-name ${CRUCIBLE_PACKAGE_NAME}"
    MARKETING_VERSION: "2.3.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
packages:
  Crucible:
    path: ..
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  MidgarKit:
    url: https://github.com/guitaripod/MidgarKit.git
    exactVersion: 4.4.0
targets:
  CrucibleApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Sources/Crucible
        excludes:
          - App/CrucibleApp.swift
      - path: App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Crucible
        product: CrucibleCore
      - package: Crucible
        product: CrucibleMedia
      - package: Crucible
        product: CrucibleStats
      - package: Crucible
        product: CrucibleDesign
      - package: Crucible
        product: CrucibleStatsUI
      - package: Crucible
        product: CrucibleActivity
      - package: Crucible
        product: CrucibleStore
      - package: Crucible
        product: CrucibleDemo
      - package: GRDB
        product: GRDB
      - package: MidgarKit
        product: MidgarCore
      - target: CrucibleWidgetsExt
        embed: true
        codeSign: true
    entitlements:
      path: Generated/CrucibleApp.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)cc.midgarcorp.shared
    info:
      path: Generated/CrucibleApp-Info.plist
      properties:
        CFBundleDisplayName: Crucible
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: Crucible connects to your Plex Media Server on your home network to browse and play your library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.guitaripod.crucible.download.continued
        NSSupportsLiveActivities: true
        NSUserActivityTypes:
          - com.guitaripod.crucible.viewMedia
          - com.guitaripod.crucible.window
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        CFBundleURLTypes:
          - CFBundleURLName: com.guitaripod.crucible
            CFBundleURLSchemes:
              - crucible
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_NAME: Crucible
        PRODUCT_MODULE_NAME: Crucible
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.crucible
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  CrucibleWidgetsExt:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Sources/CrucibleWidgets
    dependencies:
      - package: Crucible
        product: CrucibleActivity
    info:
      path: Generated/CrucibleWidgetsExt-Info.plist
      properties:
        CFBundleDisplayName: Crucible
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CrucibleWidgets
        PRODUCT_MODULE_NAME: CrucibleWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.crucible.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
  CrucibleIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: CrucibleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.crucible.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  CrucibleStoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Tests/CrucibleStoreTests
    dependencies:
      - target: CrucibleApp
      - package: Crucible
        product: CrucibleCore
      - package: Crucible
        product: CrucibleStore
      - package: MidgarKit
        product: MidgarCore
      - package: MidgarKit
        product: MidgarCommerce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.crucible.storetests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crucible.app/Crucible"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_SWIFT_FLAGS: "$(inherited) -package-name ${CRUCIBLE_PACKAGE_NAME}"
schemes:
  CrucibleIOS:
    build:
      targets:
        CrucibleApp: all
        CrucibleWidgetsExt: all
        CrucibleIOSUITests: [test]
    run:
      config: Debug
      executable: CrucibleApp
    test:
      config: Debug
      targets:
        - name: CrucibleIOSUITests
          parallelizable: false
    archive:
      config: Release
  CrucibleStoreTests:
    build:
      targets:
        CrucibleApp: all
        CrucibleStoreTests: [test]
    run:
      config: Debug
      storeKitConfiguration: ../Tests/CrucibleStoreTests/Products.storekit
    test:
      config: Debug
      targets:
        - name: CrucibleStoreTests
          parallelizable: false
