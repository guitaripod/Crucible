name: CrucibleIOS
options:
  bundleIdPrefix: com.guitaripod
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: "$(inherited) -package-name ${CRUCIBLE_PACKAGE_NAME}"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
packages:
  Crucible:
    path: ..
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  CrucibleApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Sources/Crucible
        excludes:
          - App/CrucibleApp.swift
      - path: App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Crucible
        product: CrucibleCore
      - package: Crucible
        product: CrucibleMedia
      - package: Crucible
        product: CrucibleStats
      - package: Crucible
        product: CrucibleDesign
      - package: Crucible
        product: CrucibleStatsUI
      - package: Crucible
        product: CrucibleActivity
      - package: Crucible
        product: CrucibleStore
      - package: GRDB
        product: GRDB
      - target: CrucibleWidgetsExt
        embed: true
        codeSign: true
    info:
      path: Generated/CrucibleApp-Info.plist
      properties:
        CFBundleDisplayName: Crucible
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: Crucible connects to your Plex Media Server on your home network to browse and play your library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.guitaripod.crucible.download.continued
        NSSupportsLiveActivities: true
        NSUserActivityTypes:
          - com.guitaripod.crucible.viewMedia
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        CFBundleURLTypes:
          - CFBundleURLName: com.guitaripod.crucible
            CFBundleURLSchemes:
              - crucible
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_NAME: Crucible
        PRODUCT_MODULE_NAME: Crucible
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.crucible
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  CrucibleWidgetsExt:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Sources/CrucibleWidgets
    dependencies:
      - package: Crucible
        product: CrucibleActivity
    info:
      path: Generated/CrucibleWidgetsExt-Info.plist
      properties:
        CFBundleDisplayName: Crucible
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CrucibleWidgets
        PRODUCT_MODULE_NAME: CrucibleWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.crucible.widgets
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CrucibleIOS:
    build:
      targets:
        CrucibleApp: all
        CrucibleWidgetsExt: all
    run:
      config: Debug
      executable: CrucibleApp
    archive:
      config: Release
