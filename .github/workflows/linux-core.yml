name: Linux Core

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test user
        run: useradd --create-home tester && chown -R tester "$GITHUB_WORKSPACE"
      - name: Core and Stats tests
        run: su tester --command "cd '$GITHUB_WORKSPACE' && CRUCIBLE_CORE_ONLY=1 swift test"
